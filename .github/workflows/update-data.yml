name: Update data and pages

on:
  schedule:
    - cron: '0 2 1 * *'   # 02:00 UTC on the 1st of every month
  workflow_dispatch:        # allow manual trigger from GitHub UI

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # needed to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Each upstream is optional: a failed download keeps the committed
      # file, and the pages are regenerated from whatever data is on disk.
      - name: Download NASA meteorite data
        id: meteorites
        continue-on-error: true
        run: python scripts/process_data.py

      - name: Bake fireball + crater layers
        id: layers
        continue-on-error: true
        run: python scripts/bake_layers.py

      - name: Warn about failed downloads
        if: steps.meteorites.outcome == 'failure' || steps.layers.outcome == 'failure'
        run: |
          [ "${{ steps.meteorites.outcome }}" = "failure" ] && echo "::warning::NASA meteorite download failed; keeping committed data/meteorites.json."
          [ "${{ steps.layers.outcome }}" = "failure" ] && echo "::warning::Fireball/crater bake failed; keeping committed layer data."
          exit 0

      # Fails the job (no commit) if generation breaks — better than
      # pushing a half-written site.
      - name: Regenerate detail pages, directory, and sitemap
        run: python scripts/generate_pages.py

      - name: Commit and push if anything changed
        run: |
          git add data/ m/ crater/ directory.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RECORDS=$(python -c "import json; print(len(json.load(open('data/meteorites.json'))))")
          FIREBALLS=$(python -c "import json; print(len(json.load(open('data/fireballs.json'))))")
          PAGES=$(git diff --cached --name-only -- m/ crater/ | wc -l)
          # No [skip ci]: the Cloudflare build must run to deploy this commit.
          git commit -m "chore: monthly data refresh (${RECORDS} meteorites, ${FIREBALLS} fireballs, ${PAGES} pages changed)"
          git push
          echo "Committed: ${RECORDS} meteorites, ${FIREBALLS} fireballs, ${PAGES} pages changed." >> "$GITHUB_STEP_SUMMARY"
